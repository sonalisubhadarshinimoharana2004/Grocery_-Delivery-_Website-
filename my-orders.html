<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders - blinkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen text-gray-800">
    <header class="bg-white shadow-sm sticky top-0 z-40">
      <div
        class="max-w-5xl mx-auto px-4 py-5 flex items-center justify-between gap-4"
      >
        <a href="index.html" class="text-3xl font-extrabold"
          ><span class="text-yellow-500">blink</span
          ><span class="text-green-600">it</span></a
        >
        <nav class="flex items-center gap-2 sm:gap-4">
          <a
            href="account.html"
            class="text-gray-700 font-semibold px-3 py-2 rounded-lg hover:bg-gray-100"
            >Account</a
          ><a
            href="cart.html"
            class="bg-green-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-green-700"
            >🛒 Cart</a
          >
        </nav>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-8">
      <div
        id="successMessage"
        class="hidden mb-5 rounded-xl bg-green-50 border border-green-200 text-green-800 p-4"
        role="status"
      >
        <p class="font-semibold">Order placed successfully!</p>
        <p class="text-sm mt-1">Your order details are shown below.</p>
      </div>

      <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
        <div>
          <h1 class="text-3xl font-bold">My Orders</h1>
          <p class="text-gray-500 mt-1">
            Track your orders and review order details.
          </p>
        </div>
        <a
          href="index.html"
          class="text-green-700 font-semibold hover:underline"
          >Continue shopping →</a
        >
      </div>
      <div id="myOrders" class="space-y-4">
        <p class="text-gray-500">Loading your orders…</p>
      </div>
    </main>

    <script src="js/my-orders.js"></script>
    <script src="js/account.js"></script>
  </body>
</html>
