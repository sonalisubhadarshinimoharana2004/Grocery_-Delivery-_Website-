<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - Blinkit</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @media print {
            body * {
                visibility: hidden !important;
            }

            .print-selected,
            .print-selected * {
                visibility: visible !important;
            }

            .print-selected {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                border: 0 !important;
                box-shadow: none !important;
            }

            .no-print,
            header,
            nav,
            #successMessage {
                display: none !important;
            }

            body {
                background: white !important;
            }
        }
    </style>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800">

    <!-- Navbar: Logo | Search | Continue Shopping -->
    <header class="no-print sticky top-0 z-50 border-b border-gray-200 bg-white shadow-sm">

        <nav class="mx-auto flex max-w-7xl items-center gap-3 px-3 py-4 sm:gap-5 sm:px-6 md:gap-8 md:px-8">

            <!-- Blinkit Logo -->
            <a
                href="index.html"
                class="shrink-0 text-2xl font-extrabold tracking-tight sm:text-3xl"
            >
                <span class="text-yellow-400">blink</span><span class="text-green-600">it</span>
            </a>

            <!-- Search Box -->
            <div class="relative min-w-0 flex-1">

                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                    🔍
                </span>

                <input
                    type="search"
                    id="orderSearch"
                    placeholder="Search your orders..."
                    class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-10 pr-3 text-sm outline-none transition focus:border-green-500 focus:bg-white focus:ring-2 focus:ring-green-100 sm:py-3.5"
                >

            </div>

            <!-- Continue Shopping Button -->
            <a
                href="index.html"
                class="shrink-0 whitespace-nowrap rounded-xl bg-green-600 px-3 py-3 text-xs font-semibold text-white transition hover:bg-green-700 sm:px-5 sm:text-sm"
            >
                Continue Shopping
            </a>

        </nav>

    </header>

    <!-- Main Orders Content -->
    <main class="mx-auto max-w-5xl px-4 py-6 md:px-8 md:py-8">

        <!-- Order Success Message -->
        <div
            id="successMessage"
            class="mb-5 hidden rounded-xl border border-green-200 bg-green-50 p-4 text-green-800"
            role="status"
        >

            <h2 class="font-bold">
                Order placed successfully!
            </h2>

            <p class="mt-1 text-sm">
                Your order details are shown below.
            </p>

        </div>

        <!-- Page Heading -->
        <section class="mb-6 flex items-center justify-between gap-3">

            <div>

                <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">
                    My Orders
                </h1>

                <p class="mt-2 text-sm text-gray-500">
                    View your orders and download invoices.
                </p>

            </div>

            <!-- Order Count -->
            <p
                id="orderCount"
                class="shrink-0 text-sm font-semibold text-green-700"
            ></p>

        </section>

        <!-- Orders List -->
        <section>

            <div id="myOrders" class="space-y-4">

                <!-- Loading Message -->
                <div class="rounded-xl border border-gray-200 bg-white p-8 text-center">

                    <div class="mb-3 text-4xl">
                        🛒
                    </div>

                    <p class="font-semibold text-gray-700">
                        Loading your orders...
                    </p>

                </div>

            </div>

            <!-- Order History button is created by my-orders.js -->

        </section>

        <!-- Footer Information -->
       <div class=" mt-10 pt-6 text-center text-gray-500 text-sm">

                © 2026 blinkit. All rights reserved.

            </div>

        </div>

    </main>

    <!-- My Orders JavaScript -->
    <script src="./js/my-orders.js"></script>

</body>

</html>
