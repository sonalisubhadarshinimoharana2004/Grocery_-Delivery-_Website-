<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders - blinkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @media print {
        body * {
          visibility: hidden !important;
        }
        .print-selected,
        .print-selected * {
          visibility: visible !important;
        }
        .print-selected {
          position: absolute;
          inset: 0 auto auto 0;
          width: 100%;
          box-shadow: none !important;
          border: 0 !important;
        }
        button,
        header,
        #successMessage {
          display: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen text-gray-800">
    <script src="./js/navbar.js"></script>
    <main class="max-w-5xl mx-auto p-4 md:p-8">
      <div
        id="successMessage"
        class="hidden mb-5 rounded-xl bg-green-50 border border-green-200 text-green-800 p-4"
        role="status"
      >
        <p class="font-semibold">Order placed successfully!</p>
        <p class="text-sm mt-1">Your order details are shown below.</p>
      </div>

      <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
        <div>
          <h1 class="text-3xl font-bold">My Orders</h1>
          <p class="text-gray-500 mt-1">
            Track your orders and review order details.
          </p>
        </div>
        <a
          href="index.html"
          class="text-green-700 font-semibold hover:underline"
          >Continue shopping →</a
        >
      </div>
      <h2 class="text-lg font-bold mb-3">Recent order</h2>
      <div id="myOrders">
        <p class="text-gray-500">Loading your recent order…</p>
      </div>
      <div class="mt-5 mb-3">
        <button
          id="orderHistoryButton"
          type="button"
          class="rounded-xl border border-green-600 bg-white px-5 py-3 font-semibold text-green-700 hover:bg-green-50"
        >
          Order history
        </button>
      </div>
      <section id="orderHistoryPanel" class="hidden scroll-mt-28"></section>
    </main>

    <script src="js/my-orders.js"></script>
    <script src="js/account.js"></script>
  </body>
</html>
