<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account - blinkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-800">
    <script src="./js/navbar.js"></script>
    <main class="max-w-5xl mx-auto p-4 md:p-8">
      <div class="mb-6">
        <p class="text-sm font-semibold text-green-700">YOUR ACCOUNT</p>
        <h1 class="text-3xl font-bold mt-1">Account settings</h1>
        <p class="text-gray-500 mt-2">
          Manage your profile and delivery addresses.
        </p>
      </div>
      <section
        id="profile"
        class="bg-white rounded-2xl shadow-sm p-5 md:p-7 mb-6"
      >
        <h2 class="text-xl font-bold">👤 My Profile</h2>
        <p class="text-sm text-gray-500 mt-1 mb-5">
          Update the details linked to your account.
        </p>
        <form id="profileForm" class="grid sm:grid-cols-2 gap-4">
          <label class="block text-sm font-medium"
            >Full name<input
              id="profileNameInput"
              required
              class="mt-2 w-full rounded-xl border border-gray-200 p-3 outline-none focus:border-green-600" /></label
          ><label class="block text-sm font-medium"
            >Mobile number<input
              id="profilePhoneInput"
              required
              inputmode="numeric"
              pattern="[0-9]{10}"
              maxlength="10"
              class="mt-2 w-full rounded-xl border border-gray-200 p-3 outline-none focus:border-green-600" /></label
          ><label class="block text-sm font-medium sm:col-span-2"
            >Email address<input
              id="profileEmailInput"
              type="email"
              required
              class="mt-2 w-full rounded-xl border border-gray-200 p-3 outline-none focus:border-green-600"
          /></label>
          <div class="sm:col-span-2 flex flex-wrap items-center gap-3">
            <button
              class="rounded-xl bg-green-600 px-5 py-3 font-semibold text-white hover:bg-green-700"
              type="submit"
            >
              Save profile
            </button>
            <p id="profileMessage" role="status" class="text-sm"></p>
          </div>
        </form>
      </section>
      <section
        id="address"
        class="bg-white rounded-2xl shadow-sm p-5 md:p-7 mb-6"
      >
        <h2 class="text-xl font-bold">📍 Saved Address</h2>
        <p class="text-sm text-gray-500 mt-1 mb-5">
          Use this address for your grocery deliveries.
        </p>
        <form id="addressForm" class="space-y-4">
          <label class="block text-sm font-medium"
            >Delivery address<textarea
              id="profileAddressInput"
              rows="3"
              required
              placeholder="House/flat, street, area, city, PIN code"
              class="mt-2 w-full rounded-xl border border-gray-200 p-3 outline-none focus:border-green-600"
            ></textarea>
          </label>
          <div class="flex flex-wrap items-center gap-3">
            <button
              type="submit"
              class="rounded-xl bg-green-600 px-5 py-3 font-semibold text-white hover:bg-green-700"
            >
              Save address
            </button>
            <p id="addressMessage" role="status" class="text-sm"></p>
          </div>
        </form>
      </section>
      <section
        class="bg-white rounded-2xl shadow-sm p-5 md:p-7 flex flex-wrap items-center justify-between gap-4"
      >
        <div>
          <h2 class="text-xl font-bold">📦 My Orders</h2>
          <p class="text-gray-500 mt-1">
            See your recent order and open your order history.
          </p>
        </div>
        <a
          href="my-orders.html"
          class="rounded-xl bg-green-600 px-5 py-3 font-semibold text-white hover:bg-green-700"
          >View orders →</a
        >
      </section>
      <div class="mt-6 text-center">
        <button
          id="accountPageLogout"
          class="rounded-xl border border-red-200 bg-white px-5 py-3 font-semibold text-red-600 hover:bg-red-50"
        >
          Log out
        </button>
      </div>
    </main>
    <script src="js/account.js"></script>
  </body>
</html>
