<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Account - blinkit</title>
  <link rel="stylesheet" href="account.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen text-gray-800">

  <header class="bg-white shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-5 flex items-center justify-between">

<!-- Website Logo: Redirects to Home Page -->

      <a href="index.html" class="text-3xl font-extrabold">
        <span class="text-yellow-500">blink</span>
        <span class="text-green-600">it</span>
      </a>

<!-- Navigation Links -->
      <div class="flex items-center gap-4">

<!-- Navigate to My Orders Page -->
        <a href="my-orders.html" class="text-green-700 font-semibold">
          My Orders
        </a>

<!-- Navigate to Shopping Cart -->
        <a href="cart.html" class="text-gray-700 font-semibold">
          Cart
        </a>

<!-- Return to Home Page -->

        <a href="index.html" class="text-green-700 font-semibold">
          Continue shopping
        </a>

      </div>
    </div>
  </header>


<!--  MAIN ACCOUNT PAGE CONTENT  -->


  <main class="max-w-5xl mx-auto p-4 md:p-8">

  
<!--  USER PROFILE SECTION  -->
    

    <section class="bg-white rounded-2xl shadow-sm p-6 mb-6">

      <div class="flex flex-wrap items-center justify-between gap-4">

    
        <div>
          <h1 class="text-2xl font-bold">My Account</h1>
          <p class="text-gray-500 mt-1">
            Your profile and delivery details
          </p>
        </div>

<!-- Logout Button -->

        <button
          id="logoutBtn"
          class="bg-red-50 text-red-600 font-semibold px-5 py-2 rounded-lg hover:bg-red-100">
          Log out
        </button>

      </div>

      
      <div class="grid sm:grid-cols-2 gap-4 mt-6">

       
        <div class="bg-gray-50 rounded-xl p-4">
          <p class="text-sm text-gray-500">Full name</p>
          <p id="profileName" class="font-semibold mt-1">—</p>
        </div>

        
        <div class="bg-gray-50 rounded-xl p-4">
          <p class="text-sm text-gray-500">Mobile number</p>
          <p id="profilePhone" class="font-semibold mt-1">—</p>
        </div>

        
        <div class="bg-gray-50 rounded-xl p-4">
          <p class="text-sm text-gray-500">Email</p>
          <p id="profileEmail" class="font-semibold mt-1">—</p>
        </div>


        <div class="bg-gray-50 rounded-xl p-4">
          <p class="text-sm text-gray-500">Saved delivery address</p>
          <p
            id="profileAddress"
            class="font-semibold mt-1 whitespace-pre-line">
            No address saved yet
          </p>
        </div>

      </div>
    </section>



<!--  MY ORDERS SECTION          -->

    <section class="bg-white rounded-2xl shadow-sm p-6 flex flex-wrap items-center justify-between gap-4">

<!-- My Orders Heading and Description -->

      <div>
        <h2 class="text-xl font-bold">My Orders</h2>
        <p class="text-gray-500 mt-1">
          View your past orders and order details.
        </p>
      </div>

<!-- Button Link to the Orders Page -->

      <a
        href="my-orders.html"
        class="inline-flex items-center gap-2 bg-green-600 text-white font-semibold px-5 py-3 rounded-xl hover:bg-green-700 transition">

        View My Orders
        <span aria-hidden="true">→</span>
      </a>

    </section>

  </main>


  <script src="js/account.js"></script>

</body>
</html>
```
