<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cold Drinks & Juices</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-50">


    <!-- Navbar -->

    <nav class="flex items-center justify-between px-8 py-4 bg-white shadow sticky top-0 z-50">

        <a href="index.html"
           class="text-3xl font-bold text-green-600">

            blinkit

        </a>


        <div class="flex items-center gap-5">

            <input
                type="text"
                id="searchInput"
                placeholder='Search "chocolate"'
                class="w-96 px-5 py-3 bg-gray-100 rounded-lg outline-none"
            >


            <span>
                Account
            </span>


            <a href="cart.html"
               class="bg-green-600 text-white px-5 py-3 rounded-lg">

            </a>

        </div>

    </nav>



    <!-- Page heading -->

    <section class="px-8 py-8">

        <div class="flex items-center justify-between">

            <div>

                <h1 class="text-3xl font-bold">
                    Cold Drinks & Juices
                </h1>

                <p class="text-gray-500 mt-2">

                </p>

            </div>

        </div>


        <!-- Products -->

        <div
            id="productContainer"
            class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5 mt-8">

    <script src="js/drinks.js"></script>
