<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shop Category</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-[#f7f7f7] text-gray-800">
    <header class="bg-white border-b sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 lg:px-6">
        <div class="min-h-20 py-3 flex flex-wrap items-center gap-4 md:gap-6">
          <a href="./index.html" class="min-w-fit"
            ><h1 class="text-3xl font-extrabold tracking-tight">
              <span class="text-yellow-500">blink</span
              ><span class="text-green-600">it</span>
            </h1>
            <p class="text-[10px] text-gray-500 font-medium">
              Groceries in 10 minutes
            </p></a
          >
          <div class="hidden md:block min-w-[150px]">
            <p class="text-xs text-gray-500">Delivery to</p>
            <p class="font-bold text-sm">Bhubaneswar</p>
          </div>
          <div class="flex-1 min-w-[180px] relative">
            <img
              src="./Assets/search.png"
              alt=""
              class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5"
            /><input
              id="searchInput"
              type="search"
              placeholder="Search products in this category"
              class="w-full bg-gray-100 rounded-xl py-3.5 pl-12 pr-5 outline-none border border-transparent focus:border-green-500"
            />
          </div>
          <a
            id="navAccountLink"
            href="./login.html"
            class="text-gray-700 font-semibold px-3 py-2 rounded-lg hover:bg-gray-100 whitespace-nowrap"
            >Login</a
          >
          <a
            href="./cart.html"
            class="bg-green-600 text-white rounded-xl px-4 py-3 font-semibold flex items-center gap-2 hover:bg-green-700"
            ><img
              src="./Assets/shopping-cart.png"
              alt=""
              class="h-5 w-5"
            /><span>Cart</span
            ><span
              id="cartCount"
              class="bg-white text-green-600 text-xs px-2 py-1 rounded-full"
              >0</span
            ></a
          >
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 lg:px-6 py-8">
      <a href="./index.html" class="text-sm text-green-700 hover:underline"
        >← All categories</a
      >
      <div class="mt-4">
        <h1 id="categoryTitle" class="text-3xl font-bold">Products</h1>
        <p id="categoryDescription" class="text-gray-500 mt-2"></p>
      </div>
      <div
        id="productContainer"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5 mt-8"
      ></div>
      <p id="emptyState" class="hidden text-gray-500 py-12 text-center">
        No products match your search.
      </p>
    </main>

    <script src="./js/account.js"></script>
    <script src="./js/products-data.js"></script>
    <script src="./js/category-page.js"></script>
  </body>
</html>
