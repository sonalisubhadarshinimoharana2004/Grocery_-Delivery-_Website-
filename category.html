<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shop Category</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-[#f7f7f7] text-gray-800">
    <script src="./js/navbar.js"></script>
    <main class="max-w-7xl mx-auto px-4 lg:px-6 py-8">
      <div class="mt-4">
        <h1 id="categoryTitle" class="text-3xl font-bold">Products</h1>
        <p id="categoryDescription" class="text-gray-500 mt-2"></p>
      </div>
      <div
        id="productContainer"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5 mt-8"
      ></div>
      <p id="emptyState" class="hidden text-gray-500 py-12 text-center">
        No products match your search.
      </p>
      <div
        class="mt-10 flex flex-col sm:flex-row justify-end gap-3 border-t border-gray-200 pt-6"
      >
        <a
          href="./cart.html"
          class="inline-flex items-center justify-center gap-2 rounded-xl bg-[#0c831f] px-6 py-3 font-semibold text-white shadow-sm transition hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2"
        >
          Continue to Cart <span aria-hidden="true">→</span>
        </a>
      </div>
    </main>

    <script src="./js/account.js"></script>
    <script src="./js/products-data.js"></script>
    <script src="./js/category-page.js"></script>
  </body>
</html>
