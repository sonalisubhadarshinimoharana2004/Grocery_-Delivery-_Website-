<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register - blinkit</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-50 min-h-screen">
    <script src="./js/navbar.js"></script>

    <div class="min-h-screen flex items-center justify-center px-4">
      <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-green-600">
          blink<span class="text-yellow-500">it </span>
        </h1>

        <h2 class="text-2xl font-bold text-center mt-5">Create Account</h2>

        <form id="registerForm" class="mt-6">
          <input
            id="regName"
            type="text"
            placeholder="Full Name"
            class="w-full border p-3 rounded-lg mb-4"
            required
          />

          <input
            id="regEmail"
            type="email"
            placeholder="Email"
            class="w-full border p-3 rounded-lg mb-4"
            required
          />

          <input
            id="regPhone"
            type="tel"
            placeholder="Phone Number"
            maxlength="10"
            class="w-full border p-3 rounded-lg mb-4"
            required
          />

          <input
            id="regPassword"
            type="password"
            placeholder="Password"
            class="w-full border p-3 rounded-lg mb-4"
            required
          />

          <input
            id="regConfirmPassword"
            type="password"
            placeholder="Confirm Password"
            class="w-full border p-3 rounded-lg mb-5"
            required
          />

          <button
            type="submit"
            class="w-full bg-green-600 hover:bg-green-700 text-white p-3 rounded-lg font-bold"
          >
            Register
          </button>
        </form>

        <p id="registerMessage" class="text-center mt-4"></p>

        <p class="text-center mt-5 text-gray-600">
          Already have an account?

          <a href="login.html" class="text-green-600 font-semibold"> Login </a>
        </p>
      </div>
    </div>

    <script src="js/register.js"></script>

    <script src="./js/account.js"></script>
  </body>
</html>
